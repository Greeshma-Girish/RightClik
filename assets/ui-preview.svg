<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#161b29"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2434"/>
      <stop offset="100%" stop-color="#141723"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, Monaco, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="960" height="480" rx="16" fill="url(#bg)"/>

  <!-- Web Browser Window Frame Mockup -->
  <g transform="translate(40, 30)">
    <!-- Window Bar -->
    <rect width="880" height="420" rx="12" fill="#141722" stroke="#2d3345" stroke-width="1.5"/>
    <rect width="880" height="40" rx="12" fill="#1c202e"/>
    <circle cx="22" cy="20" r="5.5" fill="#ed6a5e"/>
    <circle cx="39" cy="20" r="5.5" fill="#f4bf4f"/>
    <circle cx="56" cy="20" r="5.5" fill="#61c554"/>
    
    <!-- URL Bar -->
    <rect x="180" y="8" width="520" height="24" rx="6" fill="#11131b"/>
    <text x="440" y="24" text-anchor="middle" class="mono" font-size="11" fill="#7d879c">https://quiz.example.com/computer-science/test</text>

    <!-- Page Content Simulated -->
    <g transform="translate(45, 75)">
      <text x="0" y="20" class="sans" font-size="18" font-weight="700" fill="#e6e9f0">Question 14 of 50</text>
      
      <!-- Highlighted Question text -->
      <rect x="-4" y="36" width="460" height="30" rx="4" fill="#312a5e"/>
      <text x="0" y="56" class="sans" font-size="15" fill="#ffffff" font-weight="500">
        Which data structure provides O(1) average lookup time?
      </text>

      <!-- MCQ Radio Options -->
      <!-- Option A -->
      <g transform="translate(10, 95)">
        <circle cx="8" cy="8" r="7" fill="none" stroke="#48536e" stroke-width="1.5"/>
        <text x="26" y="13" class="sans" font-size="14" fill="#8f99ad">A) Binary Search Tree</text>
      </g>

      <!-- Option B (Auto-selected & Highlighted) -->
      <g transform="translate(10, 135)">
        <rect x="-8" y="-6" width="300" height="32" rx="6" fill="#1b2c28" stroke="#35a96d" stroke-width="1.8"/>
        <circle cx="8" cy="10" r="7" fill="#35a96d" stroke="#35a96d" stroke-width="1.5"/>
        <circle cx="8" cy="10" r="3" fill="#ffffff"/>
        <text x="26" y="15" class="sans" font-size="14" font-weight="700" fill="#7ee787">B) Hash Table / Hash Map</text>
        <text x="235" y="15" class="sans" font-size="11" font-weight="600" fill="#7ee787">✓ CLICKED</text>
      </g>

      <!-- Option C -->
      <g transform="translate(10, 180)">
        <circle cx="8" cy="8" r="7" fill="none" stroke="#48536e" stroke-width="1.5"/>
        <text x="26" y="13" class="sans" font-size="14" fill="#8f99ad">C) Linked List</text>
      </g>

      <!-- Option D -->
      <g transform="translate(10, 220)">
        <circle cx="8" cy="8" r="7" fill="none" stroke="#48536e" stroke-width="1.5"/>
        <text x="26" y="13" class="sans" font-size="14" fill="#8f99ad">D) Array (linear search)</text>
      </g>
    </g>

    <!-- RightClick Bubble Injected via Shadow DOM -->
    <g transform="translate(480, 105)">
      <!-- Bubble Card -->
      <rect width="345" height="185" rx="14" fill="url(#bubbleGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
      
      <!-- Minimal indicator dots -->
      <circle cx="22" cy="24" r="3.5" fill="#8e80ff"/>
      <text x="35" y="28" class="sans" font-size="11" font-weight="700" fill="#a499ff">RIGHTCLICK HUD</text>

      <text x="22" y="60" class="sans" font-size="15" font-weight="800" fill="#ffffff">B) Hash Table / Hash Map</text>
      <text x="22" y="85" class="sans" font-size="13" fill="#cbd1de">Uses a hash function to map keys directly to</text>
      <text x="22" y="105" class="sans" font-size="13" fill="#cbd1de">array buckets, giving constant O(1) average time.</text>

      <!-- Green confirmation pill -->
      <rect x="22" y="130" width="220" height="26" rx="6" fill="#13271f" stroke="#256d47" stroke-width="1"/>
      <text x="32" y="147" class="sans" font-size="11.5" font-weight="600" fill="#7ee787">✓ Auto-selected option B on page</text>
    </g>

    <!-- Context Menu Pointer Simulation -->
    <g transform="translate(430, 185)">
      <polygon points="0,0 12,18 7,18 10,25 6,26 3,19 0,22" fill="#ffffff" stroke="#1c202e" stroke-width="1"/>
    </g>
  </g>
</svg>
