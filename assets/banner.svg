<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a899ff"/>
      <stop offset="50%" stop-color="#8372ff"/>
      <stop offset="100%" stop-color="#5b48eb"/>
    </linearGradient>

    <!-- Accent Green Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56f5a3"/>
      <stop offset="100%" stop-color="#2bd980"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1f2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#131622" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; font-weight: 400; font-size: 20px; fill: #9da6b9; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .code-font { font-family: 'SF Mono', Consolas, Monaco, monospace; font-size: 13px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Overlay -->
  <g opacity="0.06">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M120,0 V420 M240,0 V420 M360,0 V420 M480,0 V420 M600,0 V420 M720,0 V420 M840,0 V420 M960,0 V420 M1080,0 V420" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#705af8" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="160" fill="#4d35e0" opacity="0.18" filter="url(#glow)"/>

  <!-- Left Header Section -->
  <g transform="translate(80, 85)">
    <!-- App Icon Logo -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#primaryGrad)"/>
    <text x="34" y="47" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#ffffff">R</text>

    <!-- Tagline & Titles -->
    <g transform="translate(90, 24)">
      <rect x="0" y="-18" width="168" height="26" rx="6" fill="#242244" stroke="#483f85" stroke-width="1"/>
      <text x="12" y="-1" class="badge" fill="#c0b8ff">⚡ CHROME EXTENSION</text>
    </g>

    <text x="0" y="130" class="title">RightClick AI</text>
    <text x="320" y="130" class="title" fill="#8b7cff">.</text>
    
    <text x="0" y="170" class="subtitle">Contextual Instant AI Assistant Powered by Google Gemini</text>
    <text x="0" y="196" class="subtitle" font-size="16px" fill="#757f95">Right-Click Text Selection · Image Vision Scan · Auto MCQ Solver · Floating HUD</text>

    <!-- Badges -->
    <g transform="translate(0, 235)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1b2030" stroke="#333b52" stroke-width="1"/>
      <circle cx="18" cy="17" r="4.5" fill="#56f5a3"/>
      <text x="32" y="22" class="badge" fill="#e2e6f0">Gemini 2.5 Flash</text>

      <!-- Badge 2 -->
      <rect x="147" y="0" width="125" height="34" rx="8" fill="#1b2030" stroke="#333b52" stroke-width="1"/>
      <text x="18" y="22" class="badge" fill="#8e80ff">✦</text>
      <text x="34" y="22" class="badge" fill="#e2e6f0">Manifest V3</text>

      <!-- Badge 3 -->
      <rect x="284" y="0" width="155" height="34" rx="8" fill="#1b2030" stroke="#333b52" stroke-width="1"/>
      <text x="16" y="22" class="badge" fill="#f8c15c">★</text>
      <text x="32" y="22" class="badge" fill="#e2e6f0">Auto-Select MCQ</text>
    </g>
  </g>

  <!-- Right Side: Interactive Floating Mockup Preview -->
  <g transform="translate(730, 60)">
    <!-- Main Floating Result Bubble Mockup -->
    <rect x="0" y="30" width="390" height="250" rx="16" fill="url(#cardGrad)" stroke="#39425a" stroke-width="1.2" filter="url(#glow)"/>
    
    <!-- Bubble Header -->
    <circle cx="25" cy="55" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="55" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="55" r="5" fill="#27c93f"/>
    <text x="355" y="58" text-anchor="end" class="code-font" fill="#6c7891" font-size="11px">RightClick HUD</text>
    
    <line x1="12" y1="74" x2="378" y2="74" stroke="#252b3d" stroke-width="1"/>

    <!-- Bubble Content -->
    <g transform="translate(25, 98)">
      <rect x="0" y="0" width="82" height="22" rx="4" fill="#2b2650"/>
      <text x="8" y="15" class="code-font" fill="#b9b1ff" font-weight="700" font-size="11px">QUESTION</text>
      
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14px" fill="#cbd4e3" font-weight="500">
        Which HTTP status indicates rate limiting?
      </text>

      <!-- Answer Card -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="340" height="70" rx="8" fill="#161824" stroke="#2c3345" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5px" fill="#ffffff" font-weight="700">
          429 Too Many Requests
        </text>
        <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#9da7b8">
          The user has sent too many requests in a given amount of time.
        </text>
      </g>

      <!-- Auto select badge -->
      <g transform="translate(0, 144)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#56f5a3" font-weight="600">
          ✓ Auto-selected Option (B) on active webpage
        </text>
      </g>
    </g>

    <!-- Context Menu Hint -->
    <g transform="translate(30, 298)">
      <rect x="0" y="0" width="330" height="34" rx="8" fill="#161a26" stroke="#2e3549" stroke-width="1"/>
      <text x="14" y="21" class="code-font" fill="#8e80ff">🖱️ Right-click</text>
      <text x="105" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12px" fill="#9da6b9">→ Get Answer / Vision Scan</text>
    </g>
  </g>
</svg>
